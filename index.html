<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GATE DA 2027 — Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10;
    --surface: #101422;
    --surface-card: #151a2d;
    --surface-hover: #1c223a;
    --surface-subtle: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.08);
    --border-card: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.16);
    
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --accent2: #10b981;
    --accent2-glow: rgba(16, 185, 129, 0.25);
    --accent3: #f43f5e;
    --warn: #f59e0b;
    --warn-glow: rgba(245, 158, 11, 0.25);
    
    --text: #f8fafc;
    --text2: #94a3b8;
    --text3: #64748b;
    
    --radius-sm: 6px;
    --radius: 12px;
    --radius-lg: 16px;
    --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  html {
    scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 115px);
    scroll-behavior: smooth;
  }
  body {
    background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.1) 0%, rgba(16, 185, 129, 0.03) 35%, rgba(9, 11, 16, 0) 65%),
                radial-gradient(circle at 80% 100%, rgba(244, 63, 94, 0.05) 0%, rgba(9, 11, 16, 0) 50%),
                var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
    50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
  }

  @keyframes shimmer {
    0% { background-position: -1000px 0; }
    100% { background-position: 1000px 0; }
  }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
    background: rgba(9, 11, 16, 0.82);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }

  .header {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-brand h1 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 45%, #34d399 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-brand p {
    font-size: 0.72rem;
    color: var(--text2);
    margin-top: 3px;
    letter-spacing: -0.01em;
  }
  .hright {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .overall-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 99px;
  }
  .overall-wrap span {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .obar {
    width: 120px;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .obar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2), #00d4aa);
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
  }
  .opct {
    font-size: 0.8rem;
    font-weight: 800;
    font-family: var(--font-mono);
    color: var(--accent2);
    min-width: 32px;
  }

  .nav-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: var(--font);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(8px);
  }
  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(99, 102, 241, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(99, 102, 241, 0.1);
  }
  .nav-btn:active {
    transform: translateY(0);
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 0.7rem;
    font-weight: 500;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover {
    border-color: var(--accent3);
    color: var(--accent3);
    background: rgba(244, 63, 94, 0.06);
  }

  /* WEEK TABS */
  .week-tabs {
    background: rgba(16, 20, 34, 0.65);
    border-top: 1px solid rgba(255, 255, 255, 0.03);
    padding: 6px 16px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .week-tabs::-webkit-scrollbar { display: none; }
  .wtab {
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 8px;
    border: 1px solid transparent;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text2);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wtab:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-2px);
  }
  .wtab.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.1));
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
    transform: translateY(-2px);
  }
  .wtab-pct {
    font-size: 0.65rem;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text3);
    font-weight: 700;
  }
  .wtab.active .wtab-pct {
    background: rgba(99, 102, 241, 0.25);
    color: #a5b4fc;
  }
  .wtab.complete .wtab-pct {
    background: rgba(16, 185, 129, 0.2);
    color: var(--accent2);
  }

  .main {
    padding: 24px 20px 60px;
    max-width: 920px;
    margin: 0 auto;
  }
  .week-panel { display: none; }
  .week-panel.active { display: block; }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: rgba(21, 26, 45, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .stat:hover {
    border-color: rgba(99, 102, 241, 0.3);
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(99, 102, 241, 0.15);
  }
  .stat-label {
    font-size: 0.65rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.55rem;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }
  .stat-sub {
    font-size: 0.68rem;
    color: var(--text3);
    margin-top: 2px;
  }

  /* DAY CARD */
  .day-card {
    background: rgba(21, 26, 45, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  }
  .day-card:hover {
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 12px 36px rgba(99, 102, 241, 0.16);
  }
  .day-card.completed {
    border-color: rgba(16, 185, 129, 0.4);
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(21, 26, 45, 0.5) 100%);
    box-shadow: 0 8px 32px rgba(16, 185, 129, 0.15);
  }
  .day-card.revision-day {
    border-color: rgba(99, 102, 241, 0.3);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.06) 0%, rgba(21, 26, 45, 0.5) 100%);
  }
  .day-card.today {
    border-color: rgba(245, 158, 11, 0.5);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(21, 26, 45, 0.5) 100%);
    box-shadow: 0 0 32px rgba(245, 158, 11, 0.25);
    animation: glow 2s ease-in-out infinite;
  }
  .day-card.flash-highlight {
    animation: flashRing 1.5s ease-out;
  }
  @keyframes flashRing {
    0% { outline: 3px solid rgba(99, 102, 241, 0.8); outline-offset: 2px; }
    100% { outline: 3px solid rgba(99, 102, 241, 0); outline-offset: 6px; }
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: all 0.25s ease;
  }
  .day-header:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .day-card.expanded .day-header {
    background: rgba(255, 255, 255, 0.06);
  }
  .day-num {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 800;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .day-meta { flex: 1; min-width: 0; }
  .day-date {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .day-subject {
    font-size: 0.74rem;
    color: var(--text2);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-type {
    font-size: 0.62rem;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .type-study { background: rgba(16, 185, 129, 0.12); color: var(--accent2); }
  .type-revision { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
  .type-mock { background: rgba(244, 63, 94, 0.15); color: var(--accent3); }
  
  .today-badge {
    font-size: 0.62rem;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: var(--warn);
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pulse-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 6px var(--warn);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.8; }
  }

  .day-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .mini-bar {
    width: 72px;
    height: 5px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .mini-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .mini-pct {
    font-size: 0.72rem;
    font-weight: 700;
    font-family: var(--font-mono);
    min-width: 32px;
    text-align: right;
  }
  .day-chevron {
    color: var(--text3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-chevron.open {
    transform: rotate(180deg);
    color: var(--accent);
  }

  /* TASKS */
  .day-tasks {
    display: none;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(0, 0, 0, 0.25);
  }
  .day-tasks.open {
    display: block;
  }

  .session-block {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }
  .session-block:last-child { border-bottom: none; }
  .session-title {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .session-hrs {
    font-size: 0.65rem;
    font-family: var(--font-mono);
    padding: 1px 7px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text2);
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    transition: background 0.2s ease;
  }
  .task-item:hover {
    background: rgba(255, 255, 255, 0.05);
  }
  
  .task-cb input[type=checkbox] { display: none; }
  .task-cb label {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .task-cb label:hover {
    border-color: var(--accent2);
    background: rgba(16, 185, 129, 0.12);
    transform: scale(1.08);
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
  }
  .task-cb input:checked + label {
    background: var(--accent2);
    border-color: var(--accent2);
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
  }
  .task-cb input:checked + label::after {
    content: '';
    display: block;
    width: 5px;
    height: 9px;
    border: solid #090b10;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-0.5px, -0.5px);
  }

  .task-text {
    font-size: 0.81rem;
    color: var(--text);
    line-height: 1.48;
    cursor: pointer;
    transition: color 0.15s, opacity 0.15s;
    user-select: text;
  }
  .task-item:has(input:checked) .task-text {
    color: var(--text3);
    text-decoration: line-through;
    opacity: 0.65;
  }

  .task-dur {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text3);
    background: rgba(255, 255, 255, 0.04);
    padding: 1px 5px;
    border-radius: 4px;
    margin-left: 4px;
    font-weight: 500;
  }

  /* APTITUDE STRIP */
  .apt-strip {
    background: linear-gradient(90deg, rgba(168, 85, 247, 0.08), rgba(236, 72, 153, 0.04));
    border-top: 1px solid rgba(168, 85, 247, 0.16);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .apt-strip-label {
    font-size: 0.74rem;
    color: #d8b4fe;
    font-weight: 600;
  }
  .apt-cb input[type=checkbox] { display: none; }
  .apt-cb label {
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid rgba(168, 85, 247, 0.4);
    background: rgba(168, 85, 247, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s;
  }
  .apt-cb label:hover {
    border-color: #c084fc;
    background: rgba(168, 85, 247, 0.15);
    transform: scale(1.05);
  }
  .apt-cb input:checked + label {
    background: #c084fc;
    border-color: #c084fc;
    box-shadow: 0 0 10px rgba(192, 132, 252, 0.4);
  }
  .apt-cb input:checked + label::after {
    content: '';
    display: block;
    width: 4px;
    height: 8px;
    border: solid #090b10;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-0.5px, -0.5px);
  }

  /* SYNC STATUS */
  .status {
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--text2);
    background: rgba(255, 255, 255, 0.03);
    white-space: nowrap;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status:empty { display: none; }
  .status.ok { color: var(--accent2); border-color: rgba(16, 185, 129, 0.3); }
  .status.pending { color: var(--warn); border-color: rgba(245, 158, 11, 0.35); }
  .status.err { color: var(--accent3); border-color: rgba(244, 63, 94, 0.4); }
  button.status { cursor: pointer; transition: all 0.15s; }
  button.status:hover { border-color: currentColor; background: rgba(255, 255, 255, 0.06); }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .status-dot.pulse { animation: pulse 1.2s infinite; }
  .reset-btn[hidden] { display: none; }

  /* READ-ONLY + SAVING */
  body.readonly .task-cb label, body.readonly .apt-cb label, body.readonly .task-text { cursor: default; }
  body.is-saving .day-tasks { opacity: 0.6; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(99,102,241,0.55), rgba(16,185,129,0.55)); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(99,102,241,0.85), rgba(16,185,129,0.85)); background-clip: padding-box; }
  html { scrollbar-color: rgba(99,102,241,0.55) transparent; scrollbar-width: thin; }

  /* MOTION: runs on load and week switch only, never when a task is ticked */
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes ringIn { from { stroke-dashoffset: 226.19; } }
  @keyframes checkPop { 0% { transform: scale(0.55); } 60% { transform: scale(1.22); } 100% { transform: scale(1); } }
  @keyframes dayOpen { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes cellIn { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
  @keyframes shine { from { transform: translateX(-120%) skewX(-18deg); } to { transform: translateX(260%) skewX(-18deg); } }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.6); } 100% { box-shadow: 0 0 0 9px rgba(16,185,129,0); } }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
  @keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); } }
  @keyframes flame { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }

  body.intro .hero > *, body.intro .heat-wrap, body.intro .spotlight-card, body.intro .roadmap-wrap, body.intro .filter-bar {
    animation: rise 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both;

  body.intro .hc { animation: cellIn 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.3) both; animation-delay: calc(0.25s + var(--n, 0) * 6ms); }
  body.intro .ring-fg { animation: ringIn 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: 0.15s; }
  body.intro .week-panel.active .day-card, body.intro-week .week-panel.active .day-card {
    animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .week-panel.active .day-card:nth-child(2) { animation-delay: 0.05s; }
  .week-panel.active .day-card:nth-child(3) { animation-delay: 0.1s; }

  .day-tasks.opening { animation: dayOpen 0.32s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .task-cb input.pop:checked + label, .apt-cb input.pop:checked + label { animation: checkPop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.4); }

  /* RIPPLE */
  .nav-btn, .filter-chip, .btn, .wtab, .phase-card, .insight-btn, .ip-btn, .cheer-btn { position: relative; overflow: hidden; }
  .wtab, .nav-btn, .cheer-btn, .filter-chip { flex-shrink: 0; }
  .rip { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.22; transform: scale(0); pointer-events: none; animation: ripple 0.6s ease-out forwards; }

  /* HERO TILES */
  .hero { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .tile {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(28, 34, 58, 0.75), rgba(17, 21, 36, 0.75));

  }
  .tile::before {
    content: ''; position: absolute; width: 160px; height: 160px; right: -60px; top: -70px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow, rgba(99,102,241,0.28)), transparent 70%); pointer-events: none;
  }
  .tile:hover { border-color: rgba(255, 255, 255, 0.16); transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); }
  .tile-label { font-size: 0.64rem; font-weight: 700; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
  .tile-value { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 6px; line-height: 1.05; }
  .tile-value small { font-size: 0.8rem; font-weight: 700; color: var(--text2); margin-left: 3px; letter-spacing: 0; }
  .tile-sub { font-size: 0.7rem; color: var(--text2); margin-top: 5px; line-height: 1.4; }
  .hero-main { display: flex; align-items: center; gap: 16px; }
  .hero-greet { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em; }
  .hero-greet-sub { font-size: 0.72rem; color: var(--text2); margin-top: 3px; line-height: 1.45; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.1em; color: var(--accent2); background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); padding: 2px 8px; border-radius: 99px; margin-bottom: 6px; }
  .live-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: livePulse 1.6s infinite; }
  .flame { display: inline-block; animation: flame 1.4s ease-in-out infinite; transform-origin: 50% 90%; }
  .meter { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; margin-top: 10px; }
  .meter > div { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }

  /* PROGRESS RING */
  .ring { position: relative; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 8; }
  .ring-fg { fill: none; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 226.19; transition: stroke-dashoffset 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 800; }
  .ring-in b { font-size: 1.15rem; letter-spacing: -0.03em; }
  .ring-in span { font-size: 0.55rem; color: var(--text3); font-family: var(--font); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; }

  /* ACTIVITY HEATMAP */
  .heat-wrap { background: rgba(21, 26, 45, 0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 18px 14px; margin-bottom: 20px; box-shadow: 0 8px 28px rgba(0,0,0,0.2); }
  .heat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .heat-title { font-size: 0.68rem; font-weight: 700; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
  .heat-legend { display: flex; align-items: center; gap: 4px; font-size: 0.62rem; color: var(--text3); }
  .heat-legend .hc { width: 11px; height: 11px; cursor: default; }
  .heat-legend .hc:hover { transform: none; }
  .heat-scroll { overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
  .heat-scroll::-webkit-scrollbar { display: none; }
  .heat { display: grid; grid-template-columns: 28px; grid-auto-columns: 22px; grid-template-rows: 14px repeat(7, 22px); gap: 5px; width: max-content; }
  .heat-dow { font-size: 0.58rem; color: var(--text3); display: flex; align-items: center; }
  .heat-mon { font-size: 0.6rem; font-weight: 700; color: var(--text2); white-space: nowrap; }
  .hc { position: relative; border-radius: 6px; background: rgba(255,255,255,0.045); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border: none; padding: 0; }
  .hc:hover { transform: scale(1.3); z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  .hc.l1 { background: rgba(16,185,129,0.25); }
  .hc.l2 { background: rgba(16,185,129,0.45); }
  .hc.l3 { background: rgba(16,185,129,0.7); }
  .hc.l4 { background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.45); }
  .hc.miss { background: rgba(244,63,94,0.16); }
  .hc.slip { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 6px); }
  .hc.future { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  .hc.today { outline: 2px solid var(--warn); outline-offset: 2px; }
  .hc.t-mock::after, .hc.t-revision::after { content: ''; position: absolute; width: 5px; height: 5px; border-radius: 50%; right: 3px; top: 3px; }
  .hc.t-mock::after { background: #fb7185; }
  .hc.t-revision::after { background: #a5b4fc; }
  .hc.sel { box-shadow: 0 0 0 2px #fff; }
  .heat-foot { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.68rem; color: var(--text2); margin-top: 8px; }
  .heat-foot b { color: var(--text); font-family: var(--font-mono); }

  /* INSIGHTS BUTTON ON DAY CARDS */
  .insight-btn {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    font-size: 0.68rem; font-weight: 700; color: #c7d2fe; font-family: var(--font);
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.3);
    padding: 5px 10px; border-radius: 99px; cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .insight-btn:hover { background: rgba(99,102,241,0.24); border-color: rgba(99,102,241,0.6); transform: translateY(-1px); }

  /* DAY INSIGHTS PANEL */
  .panel-back { position: fixed; inset: 0; z-index: 180; background: rgba(5,6,12,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.35s; }
  .panel-back.open { opacity: 1; pointer-events: auto; }
  .side-panel {
    position: fixed; top: 0; right: 0; z-index: 190; width: min(460px, 100%); height: 100vh; height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
    background: linear-gradient(180deg, rgba(18,22,38,0.98), rgba(10,12,20,0.98));
    border-left: 1px solid rgba(255,255,255,0.1); box-shadow: -30px 0 80px rgba(0,0,0,0.55);
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
    transform: translateX(104%); visibility: hidden;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.45s;
  }
  .side-panel.open { transform: none; visibility: visible; transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s; }
  .side-panel.panel-intro .ring-fg { animation: ringIn 1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .side-panel.panel-intro .ip-sec { animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .side-panel.panel-intro .ip-sec:nth-of-type(2) { animation-delay: 0.05s; }
  .side-panel.panel-intro .ip-sec:nth-of-type(3) { animation-delay: 0.1s; }
  .side-panel.panel-intro .ip-sec:nth-of-type(4) { animation-delay: 0.15s; }
  .side-panel.panel-intro .ip-sec:nth-of-type(5) { animation-delay: 0.2s; }
  .side-panel.panel-intro .tl-seg { animation: dayOpen 0.5s both; animation-delay: calc(var(--n, 0) * 25ms); }
  .ip-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .ip-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: var(--text); cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s, transform 0.2s; }
  .ip-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); transform: scale(1.06); }
  .ip-btn:disabled { opacity: 0.3; cursor: default; }
  .ip-hint { font-size: 0.62rem; color: var(--text3); }
  .ip-hero { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: linear-gradient(135deg, var(--sbg, rgba(99,102,241,0.12)), rgba(255,255,255,0.02)); margin-bottom: 16px; }
  .ip-tag { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
  .ip-date { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; margin-top: 6px; }
  .ip-label { font-size: 0.76rem; color: var(--text2); margin-top: 3px; line-height: 1.4; }
  .ip-sec { margin-bottom: 18px; }
  .ip-sec-title { font-size: 0.64rem; font-weight: 700; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; }
  .ip-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ip-kpi { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px 11px; }
  .ip-kpi b { display: block; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
  .ip-kpi span { font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .ip-note { font-size: 0.74rem; line-height: 1.5; color: var(--text2); padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
  .ip-note.warn { color: #fcd34d; background: rgba(245,158,11,0.07); border-color: rgba(245,158,11,0.25); }
  .ip-note.good { color: #6ee7b7; background: rgba(16,185,129,0.07); border-color: rgba(16,185,129,0.25); }
  .tl { position: relative; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.03); overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
  .tl-seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid rgba(10,12,20,0.85); cursor: help; transition: filter 0.15s; }
  .tl-seg:hover { filter: brightness(1.35); }
  .tl-seg.todo { opacity: 0.4; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.3) 0 4px, transparent 4px 8px) !important; }
  .tl-brk { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 5px); }
  .tl-now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .tl-ticks { position: relative; height: 16px; margin-top: 4px; }
  .tl-ticks span { position: absolute; transform: translateX(-50%); font-size: 0.58rem; color: var(--text3); font-family: var(--font-mono); white-space: nowrap; }
  .mix { display: flex; align-items: center; gap: 18px; }
  .donut { width: 116px; height: 116px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after { content: ''; position: absolute; inset: 17px; border-radius: 50%; background: #11141f; }
  .donut-in { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-in b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 800; }
  .donut-in span { font-size: 0.56rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; }
  .legend-row i { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-row .nm { flex: 1; min-width: 0; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-row .hv { font-family: var(--font-mono); color: var(--text); font-size: 0.68rem; }
  .kinds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .kind { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 9px 11px; }
  .kind-top { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; }
  .kind-top span:last-child { font-family: var(--font-mono); color: var(--text2); font-weight: 600; }
  .kind .meter { margin-top: 7px; height: 4px; }
  .ip-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* TOASTS */
  .toasts { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: min(360px, calc(100vw - 32px));
    font-size: 0.8rem; font-weight: 600; color: var(--text);
    background: rgba(21,26,45,0.96); border: 1px solid rgba(255,255,255,0.12); border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 11px 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: toastIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1.2);
  }
  .toast.good { border-left-color: var(--accent2); }
  .toast.bad { border-left-color: var(--accent3); }
  .toast.out { animation: toastOut 0.3s ease-in forwards; }

  /* CONFETTI */
  .confetti-piece { position: fixed; top: -14px; z-index: 400; pointer-events: none; border-radius: 2px; animation: fall var(--t) cubic-bezier(0.25, 0.4, 0.5, 1) forwards; }

  /* FOOTER */
  .foot { margin-top: 28px; text-align: center; font-size: 0.68rem; color: var(--text3); line-height: 1.8; }
  .foot kbd { font-family: var(--font-mono); font-size: 0.62rem; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: var(--text2); }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr 1fr; }
    .hero-main, .hero > :last-child { grid-column: 1 / -1; }
    .heat { grid-auto-columns: 17px; grid-template-rows: 14px repeat(7, 17px); gap: 4px; }
    .insight-btn .lbl { display: none; }
    .insight-btn { padding: 5px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
  }

  @media(max-width: 640px) {
    .main { padding: 14px 12px 60px; }
    .header { padding: 12px 14px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { padding: 10px 12px; }
    .stat-value { font-size: 1.3rem; }
    .day-header { padding: 12px 14px; gap: 10px; }
    .session-block { padding: 10px 14px; }
    .apt-strip { padding: 8px 14px; }
  }


  /* OWNER SIGN-IN */
  .modal-back[hidden] { display: none; }
  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(5, 6, 12, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeInUp 0.3s ease-out;
  }
  .modal {
    background: rgba(16, 20, 34, 0.8);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    animation: fadeInUp 0.4s ease-out;
  }
  .modal h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .modal p { font-size: 0.78rem; color: var(--text2); line-height: 1.5; margin-bottom: 14px; }
  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    font-family: var(--font-mono);
    transition: border-color 0.15s;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }
  .modal-err { font-size: 0.74rem; color: var(--accent3); min-height: 1.2em; margin: 8px 0; line-height: 1.4; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    background: linear-gradient(135deg, var(--accent), #5551e6);
    border: none;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: default;
    transform: none;
  }

  /* ROADMAP / PHASES */
  .roadmap-wrap {
    margin-bottom: 24px;
    background: rgba(21, 26, 45, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    transition: border-color 0.3s ease;
  }

  .roadmap-wrap:hover {
    border-color: rgba(255, 255, 255, 0.15);
  }
  .roadmap-title {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .roadmap-phases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .phase-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
  }
  .phase-card:hover {
    background: rgba(255, 255, 255, 0.08);

  [/^(DS|Algo):/, 'dsa'], [/^ML\b/, 'ml'], [/^AI\b/, 'ai'], [/^DB/, 'db'], [/^(⏸|Nothing pending|✍️)/, 'rev']];

})();

// Progress lives in progress.json in the same public repo that serves this
// page on GitHub Pages. Everyone reads it; only you can write it, using a
// fine-grained token (this repo only, Contents: read & write) that you paste
// once per device. Each save is a commit, so the repo keeps full history.
const CONFIG = {
  owner: '',               // GitHub username. Blank = read from <username>.github.io
  repo: '',                // repo name. Blank = read from the URL path
  branch: '',              // blank = the repo's default branch
  path: 'progress.json',
};
const TOKEN_KEY = 'gate_gh_token';        // owner's token, this browser only
const PENDING_KEY = 'gate_gh_pending';    // ticks not yet committed (survives reloads)
const CACHE_KEY = 'gate_gh_cache';        // last progress seen, for instant first paint
const LOCAL_KEY = 'gate_daily_v4';        // fallback when opened as a plain file
const OLD_LOCAL_KEY = 'gate_daily_v3';
const UI_KEY = 'gate_daily_ui';           // per viewer: which days are expanded
const SAVE_DELAY = 2500;
const REFRESH_MS = 5 * 60 * 1000;

const REPO = detectRepo();
let ui = loadUI();                // { open: { dayIndex: true } }
let activeWeek = 0;
let mode = 'loading';             // 'loading' | 'owner' | 'viewer' | 'local'
let ready = false;                // first load from GitHub finished
let token = lsGet(TOKEN_KEY) || '';
let remote = loadCache();         // last progress.json seen { done, updatedAt }
let pending = {};                 // taskKey -> true / false, not yet committed
let resetSeq = 0, savedResetSeq = 0;
let state = { done: { ...remote.done }, updatedAt: remote.updatedAt };
let saving = false, saveTimer = null, saveError = '', saveAction = '', loadError = '';
let lastFetch = 0, retryDelay = 5000;

function detectRepo() {
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
  const owner = CONFIG.owner || (m && m[1]);
  if (!owner) return null;
  let repo = CONFIG.repo;
  if (!repo) {
    if (!m) return null;
    const first = location.pathname.split('/').filter(Boolean)[0];
    repo = first && !/\.html?$/i.test(first) ? decodeURIComponent(first) : owner + '.github.io';
  }
  return { owner, repo };
}

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function normalize(s) {
  const done = {};
  if (s && s.done && typeof s.done === 'object') for (const k in s.done) if (s.done[k]) done[k] = true;
  return { done, updatedAt: (s && typeof s.updatedAt === 'number') ? s.updatedAt : null };
}
function loadCache() { try { return normalize(JSON.parse(lsGet(CACHE_KEY))); } catch { return normalize(null); } }
function saveCache(s) { lsSet(CACHE_KEY, JSON.stringify(s)); }
function isDone(k) { return !!state.done[k]; }
function editable() { return (mode === 'owner' && ready) || mode === 'local'; }
function hasPending() { return resetSeq > savedResetSeq || Object.keys(pending).length > 0; }

function loadUI() {
  try { const u = JSON.parse(lsGet(UI_KEY)); if (u && u.open) return u; } catch {}
  return { open: {} };
}
function saveUI() { lsSet(UI_KEY, JSON.stringify(ui)); }

function persistPending() {
  if (hasPending()) lsSet(PENDING_KEY, JSON.stringify({ ops: pending, reset: resetSeq > savedResetSeq }));
  else lsDel(PENDING_KEY);
}
function restorePending() {
  try {
    const p = JSON.parse(lsGet(PENDING_KEY));
    if (p && p.ops) pending = p.ops;
    if (p && p.reset) { resetSeq = 1; savedResetSeq = 0; }
  } catch {}
}
// What you see as owner = last committed progress + your uncommitted ticks
function withPending(base) {
  const done = resetSeq > savedResetSeq ? {} : { ...base.done };
  for (const k in pending) { if (pending[k]) done[k] = true; else delete done[k]; }
  return { done, updatedAt: base.updatedAt };
}

// ── GitHub Contents API ──
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);

let cheerCount = parseInt(lsGet('gate_cheers_sent') || '0', 10);

function playCheerChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    const freqs = [523.25, 659.25, 783.99, 1046.50];
    const freq = freqs[Math.floor(Math.random() * freqs.length)];
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch {}
}

function sendCheer(event) {
  cheerCount++;
  lsSet('gate_cheers_sent', cheerCount);
  playCheerChime();
  
  const emojis = ['🎉', '🔥', '💪', '🚀', '👏', '⭐', '💯', '🎯', '✨', '🏆'];

  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;

  for (let i = 0; i < 7; i++) {
    const p = document.createElement('div');
    p.className = 'floating-particle';

    p.style.top = `${originY + (Math.random() * 20 - 10)}px`;
    p.style.setProperty('--tx', `${(Math.random() - 0.5) * 120}px`);
    p.style.setProperty('--ty', `${-(Math.random() * 60 + 50)}px`);
    p.style.setProperty('--ty2', `${-(Math.random() * 80 + 110)}px`);
    p.style.setProperty('--tr', `${(Math.random() - 0.5) * 60}deg`);

function taskKind(k) {
  if (k.startsWith('apt_')) return 'apt';
  const t = taskTextOf(k);
  if (/^📝 GO Test Series/.test(t)) return 'test';
  if (/^📝/.test(t)) return 'quiz';
  if (/MOCK \d/.test(t)) return 'mock';
  if (/FULL SYLLABUS REVISION/.test(t)) return 'revise';
  if (/^(🎯|📘)/.test(t)) return 'pyq';
  if (/^✍️/.test(t)) return 'notes';
  if (/^(⏸|Nothing pending|Catch up|Buffer|Fallback)/.test(t)) return 'buffer';
  if (/^(Revise|Re-solve|Update error|Write a 1-page|Quick sweep|Formula sheet|Light|Check every|Weak topics|Solve 10|Full formula|Mock \d+ analysis|GATE DA 20\d\d analysis|PYQ warm-up|DBMS: every|Calculus \+|Error log|20 easy)/.test(t)) return 'revise';
  if (/ · /.test(t)) return 'lecture';
  return 'other';
}
function taskHours(k) { return k.startsWith('apt_') ? 0.5 : estHours(taskTextOf(k)); }
function plainTask(k) { return k.startsWith('apt_') ? aptText(+k.split('_')[1]) : taskTextOf(k); }
function midnight(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function daysFromToday(i) { return Math.round((midnight(dayDate(i)) - midnight(new Date())) / 864e5); }
function daysToExam() { return Math.max(0, Math.round((EXAM - midnight(new Date())) / 864e5)); }

function streakInfo() {
  const t = todayIndex();
  const last = t !== null ? t : (dayDate(DAYS.length - 1) < new Date() ? DAYS.length - 1 : null);
  const active = i => dayTasks(i).some(isDone);
  let cur = 0, best = 0, run = 0, activeDays = 0;
  if (last === null) return { cur, best, activeDays };
  for (const i of ALL_IDX) {
    if (i > last) break;
    if (active(i)) { run++; activeDays++; best = Math.max(best, run); } else if (i !== last) run = 0;
  }
  let i = active(last) ? last : last - 1;
  while (i >= ALL_IDX[0] && active(i)) { cur++; i--; }
  return { cur, best, activeDays };
}

function ring(p, color, size, inner) {

}

function renderHeatmap() {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function hhmm(m) { const h = Math.floor(m / 60) % 24; return `${((h + 11) % 12) + 1}${h < 12 ? 'a' : 'p'}`; }

  const planH = tasks.reduce((a, k) => a + taskHours(k), 0), doneH = done.reduce((a, k) => a + taskHours(k), 0);

  setTimeout(() => {
    const el = document.getElementById(`day-${i}`);
    if (!el) return;
    const bar = document.querySelector('.topbar');
    window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - (bar ? bar.offsetHeight : 0) - 12, behavior: 'smooth' });
    el.classList.add('flash-highlight');
    setTimeout(() => el.classList.remove('flash-highlight'), 1600);
  }, 60);
}

function countUp(root) {
  if (REDUCED) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, suf = el.dataset.suf || '';
    if (!isFinite(to) || to <= 0) return;
    const t0 = performance.now(), dur = 1200;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e) + suf;
      if (p < 1) requestAnimationFrame(step);
    };
    el.textContent = '0' + suf;
    requestAnimationFrame(step);
  });
}

function startIntro() {
  if (REDUCED) return;
  document.body.classList.add('intro');
  clearTimeout(introTimer);
  introTimer = setTimeout(() => document.body.classList.remove('intro'), 2000);
}
function weekIntro() {
  if (REDUCED) return;
  document.body.classList.add('intro-week');
  clearTimeout(weekTimer);
  weekTimer = setTimeout(() => document.body.classList.remove('intro-week'), 900);
}

function toast(msg, kind) {
  const box = document.getElementById('toasts');
  if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3400);
}

function confetti() {
  if (REDUCED) return;
  const colors = ['#10b981', '#6366f1', '#f59e0b', '#f43f5e', '#38bdf8', '#a78bfa', '#facc15'];
  for (let n = 0; n < 110; n++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const w = 6 + Math.random() * 6;
    p.style.cssText = `left:${Math.random() * 100}vw;width:${w}px;height:${w * (1.3 + Math.random())}px;background:${colors[n % colors.length]};` +
      `--dx:${(Math.random() - 0.5) * 300}px;--rot:${(Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 900)}deg;--t:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.35}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function celebrateIfDone(i, before) {
  if (before === 100 || dayPct(i) !== 100) return;
  confetti();
  toast(`🎉 ${dayTag(i)} complete. Every task on ${formatDate(dayDate(i))} is done!`, 'good');
  const w = i < 0 ? -1 : Math.floor(i / 7);
  if (weekPct(w) === 100) setTimeout(() => toast(`🏆 ${w < 0 ? 'Pre-plan week' : 'Week ' + (w + 1)} finished at 100%`, 'good'), 600);
}

// Ripple on buttons
document.addEventListener('pointerdown', e => {
  if (REDUCED) return;
  const b = e.target.closest('.nav-btn,.filter-chip,.btn,.wtab,.phase-card,.insight-btn,.ip-btn,.cheer-btn');
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2;
  const sp = document.createElement('span');
  sp.className = 'rip';
  sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(sp);
  setTimeout(() => sp.remove(), 650);
});

// Subtle 3D tilt on hero tiles (mouse only)
let tiltEl = null;
document.addEventListener('pointermove', e => {
  if (REDUCED || e.pointerType !== 'mouse') return;
  const t = e.target.closest && e.target.closest('.tile');
  if (tiltEl && tiltEl !== t) { tiltEl.style.transform = ''; tiltEl = null; }
  if (!t) return;
  tiltEl = t;
  const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
  t.style.transform = `perspective(700px) rotateY(${(x * 7).toFixed(2)}deg) rotateX(${(-y * 7).toFixed(2)}deg) translateY(-2px)`;
});

// Swipe: weeks on the page, days inside the insights panel
let touch0 = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touch0 = null; return; }
  if (e.target.closest('.heat-scroll,.week-tabs,.roadmap-phases,.hright,.modal-back')) { touch0 = null; return; }
  touch0 = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const dx = e.changedTouches[0].clientX - touch0.x, dy = e.changedTouches[0].clientY - touch0.y, dt = Date.now() - touch0.t;
  touch0 = null;
  if (dt > 700 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const step = dx < 0 ? 1 : -1;
  if (panelOpen) { navInsights(step); return; }
  const w = activeWeek + step;
  if (w >= FIRST_WEEK && w < TOTAL_WEEKS) switchWeek(w);
}, { passive: true });

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (panelOpen) {
    if (e.key === 'Escape') closeInsights();
    else if (e.key === 'ArrowLeft') navInsights(-1);
    else if (e.key === 'ArrowRight') navInsights(1);
    else return;
    e.preventDefault(); return;
  }
  const an = document.getElementById('analytics-modal');
  if (an && !an.hidden) { if (e.key === 'Escape') closeAnalytics(); return; }
  const lg = document.getElementById('login');
  if (lg && !lg.hidden) { if (e.key === 'Escape') closeLogin(); return; }
  if (e.key === 'ArrowLeft' && activeWeek > FIRST_WEEK) switchWeek(activeWeek - 1);
  else if (e.key === 'ArrowRight' && activeWeek < TOTAL_WEEKS - 1) switchWeek(activeWeek + 1);
  else if (e.key === 't' || e.key === 'T') jumpToToday();
  else if (e.key === 'i' || e.key === 'I') openInsights(todayIndex() ?? 0);
  else if (e.key === 'a' || e.key === 'A') openAnalytics();
  else return;
  e.preventDefault();
});

function renderStatus() {
  const slot = document.getElementById('status-slot');
  if (!slot) return;
  let cls = '', text = '', action = '', dot = '';
  if (mode === 'loading' || (mode !== 'local' && !ready)) {
    cls = 'pending'; text = 'Loading…'; dot = '<span class="status-dot pulse"></span>';
  } else if (mode === 'local') {
    text = 'Local only'; dot = '<span class="status-dot"></span>';
  } else if (mode === 'viewer') {
    if (saveError) { cls = 'err'; text = saveError; action = saveAction; dot = '<span class="status-dot err"></span>'; }
    else { text = 'View only' + (loadError ? ' · ' + loadError : (state.updatedAt ? ' · updated ' + timeAgo(state.updatedAt) : '')); dot = '<span class="status-dot"></span>'; }
  } else if (mode === 'owner') {
    if (saving) { cls = 'pending'; text = 'Saving…'; dot = '<span class="status-dot pulse"></span>'; }
    else if (saveError) { cls = 'err'; text = saveError; action = saveAction; dot = '<span class="status-dot err"></span>'; }
    else if (hasPending()) { cls = 'pending'; text = 'Unsaved · save now'; action = 'saveNow()'; dot = '<span class="status-dot pulse"></span>'; }
    else if (loadError) { cls = 'err'; text = 'Signed in · ' + loadError; dot = '<span class="status-dot err"></span>'; }
    else { cls = 'ok'; text = 'Saved' + (state.updatedAt ? ' · ' + timeAgo(state.updatedAt) : ''); dot = '<span class="status-dot"></span>'; }
  }
  slot.innerHTML = action
    ? `<button class="status ${cls}" onclick="${action}">${dot}${esc(text)}</button>`
    : `<span class="status ${cls}">${dot}${esc(text)}</span>`;
  const reset = document.getElementById('reset-btn');
  if (reset) reset.hidden = !editable();
  const so = document.getElementById('signout-btn');
  if (so) so.hidden = mode !== 'owner';
  document.body.classList.toggle('readonly', !editable());
}

function weekLabel(w) {

  if (d1.getMonth() === d2.getMonth()) return `${months[d1.getMonth()]} ${d1.getDate()}–${d2.getDate()}`;

                <label for="apt_cb_${i}"></label>
              </div>
              <div class="apt-strip-label">${timeChip(i, `apt_${i}`)}${formatTaskText(aptText(i))}</div>
            </div>`}
            ${dayTasks(i).length ? `<div class="break-row end"><span class="task-time">${clock(dayTimeline(i)._end)}</span>✅ Day done${dayTimeline(i)._end > SLEEP_AT ? ' (running late: trim the last task, protect sleep)' : '. Wind down, no screens; sleep by 10:30 pm for the 6:00 am start'}</div>` : ''}
            ${editable() && dayTasks(i).length ? `<div style="text-align:right;padding:8px 4px 2px"><button class="filter-chip" onclick="markDay(${i})">${pct === 100 ? '↺ Untick whole day' : '✓ Mark whole day done'}</button></div>` : ''}
          </div>
        </div>`;
      });
    }
    html += `</div>`;
  }

  html += `<div class="foot">Shortcuts: <kbd>←</kbd> <kbd>→</kbd> weeks · <kbd>T</kbd> today · <kbd>I</kbd> today's insights · <kbd>A</kbd> analytics · swipe sideways on your phone to change week</div>`;

  main.innerHTML = html;
  justOpened = null;
  document.getElementById('obar-fill').style.width = op + '%';
  document.getElementById('opct').textContent = op + '%';
  if (!countedIntro && document.body.classList.contains('intro')) { countedIntro = true; countUp(main); }
  if (panelOpen) renderInsights(false);
}
let countedIntro = false;

function renderAll() { renderTabs(); renderMain(); renderStatus(); }

function switchWeek(w) {
  activeWeek = w;
  weekIntro();
  renderTabs();
  renderMain();
  scrollActiveTabIntoView();
  window.scrollTo({top:0,behavior:'smooth'});
}

function scrollActiveTabIntoView() {
  const tabs = document.getElementById('week-tabs');
  const activeTab = tabs ? tabs.querySelector('.wtab.active') : null;
  if (activeTab && tabs) {
    const tabLeft = activeTab.offsetLeft;
    const tabWidth = activeTab.offsetWidth;
    const containerWidth = tabs.offsetWidth;
    tabs.scrollTo({
      left: tabLeft - (containerWidth / 2) + (tabWidth / 2),
      behavior: 'smooth'
    });
  }
}

function jumpToToday() {
  const t = todayIndex();
  if (t === null) { toast('Today is outside the plan dates', ''); return; }
  jumpToDay(t);
}

function toggleWeekExpand() {
  const days = weekDays(activeWeek);
  const anyOpen = days.some(i => ui.open[i]);
  days.forEach(i => {
    ui.open[i] = !anyOpen;
  });
  saveUI();
  renderMain();
}

function toggleDay(i) {
  ui.open[i] = !ui.open[i];
  if (ui.open[i]) justOpened = i;
  saveUI(); renderMain();
}

function toggleTask(k) {
  if (!editable()) { renderMain(); return; }
  const v = !state.done[k];
  const di = +k.split('_')[1], before = dayPct(di);
  if (v) state.done[k] = true; else delete state.done[k];
  if (mode === 'owner') { pending[k] = v; persistPending(); }
  lastToggled = v ? k : null;
  renderMain(); renderTabs();
  lastToggled = null;
  celebrateIfDone(di, before);
  queueSave();
}

function markDay(i) {
  if (!editable()) return;
  const tasks = dayTasks(i);
  const v = !tasks.every(isDone), before = dayPct(i);
  tasks.forEach(k => {
    if (v) state.done[k] = true; else delete state.done[k];
    if (mode === 'owner') pending[k] = v;
  });
  if (mode === 'owner') persistPending();
  renderMain(); renderTabs();
  celebrateIfDone(i, before);
  queueSave();
}

function resetAll() {
  if (!editable()) return;
  if (!confirm('Reset ALL progress?')) return;
  state.done = {};
  if (mode === 'owner') { pending = {}; resetSeq++; persistPending(); }
  renderAll();
  queueSave(0);
}

// Auto-open today
function autoOpenToday() {
  let found = false;
  for (let i = 0; i < DAYS.length; i++) {
    if (isToday(dayDate(i))) {
      activeWeek = Math.floor(i / 7);
      ui.open[i] = true;
      found = true;
      break;
    }
  }
  // If today not in range, open first incomplete week
  if (!found) {
    for (let w = 0; w < TOTAL_WEEKS; w++) {
      if (weekPct(w) < 100) { activeWeek = w; break; }
    }
  }
}

renderShell();
autoOpenToday();
startIntro();
renderAll();
scrollActiveTabIntoView();
initPersistence();
setInterval(renderStatus, 60000);
</script>
</body>
</html>
